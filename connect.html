<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d16">
<meta name="description" content="Connect with Querily Labs about Qincept, institutional pilots, research, and strategic collaborations.">
<title>Connect — Querily Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { color-scheme:dark; --bg:#0b0d16; --purple:#5e17eb; --light:#bea5ff; --muted:#b9b4c7; }
* { box-sizing:border-box; }
html { min-height:100%; }
body { margin:0; min-height:100vh; padding:22px; display:grid; place-items:center; background:radial-gradient(ellipse at 80% 12%,#5e17eb33,transparent 55%),#0b0d16; color:#f7f5ff; font-family:'DM Sans',sans-serif; }
.card { width:min(520px,100%); position:relative; isolation:isolate; overflow:hidden; padding:29px; border:1px solid #8862c6; border-radius:22px; background:radial-gradient(circle at 100% 0%,#351e56,transparent 49%),#13111f; box-shadow:0 30px 90px #0008; }
.card::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background-image:radial-gradient(circle,#a887ff24 .85px,transparent 1px),linear-gradient(90deg,#aa87ff0b 1px,transparent 1px),linear-gradient(#aa87ff0b 1px,transparent 1px); background-size:14px 14px,56px 56px,56px 56px; }
.header { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
.eyebrow { color:var(--light); font:700 10px 'Space Grotesk',sans-serif; letter-spacing:.19em; text-transform:uppercase; }
h1 { font:600 clamp(27px,5vw,35px)/1.1 'Space Grotesk',sans-serif; letter-spacing:-.055em; margin:11px 0 8px; }
.description { color:#c4bbd7; font-size:13px; line-height:1.7; margin:5px 0 22px; }
.close { flex:none; width:36px; height:36px; border:1px solid #a88de966; background:#221a32; color:#fff; border-radius:50%; font-size:24px; cursor:pointer; }
.close:hover { background:#5e17eb; }
form { display:grid; gap:14px; }
.honeypot { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
.turnstile-box { min-height:66px; }
.form-status { margin:0; min-height:18px; color:#c9b9f6; font-size:12px; line-height:1.55; }
.form-status[data-state="error"] { color:#ffb6bb; }
.form-status[data-state="success"] { color:#b7f3d0; }
.submit:disabled { cursor:not-allowed; opacity:.55; }

label { display:grid; gap:7px; color:#e6dcfa; font-size:12px; font-weight:700; }
input,select,textarea { width:100%; border:1px solid #9e81d75e; border-radius:11px; padding:12px 13px; background:#191727; color:#fff; font:400 13px 'DM Sans',sans-serif; }
input::placeholder,textarea::placeholder { color:#a99dbd; }
select option { background:#191727; color:#fff; }
textarea { min-height:98px; resize:vertical; }
button, a { -webkit-tap-highlight-color:transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid #c9b2ff; outline-offset:3px; }
.submit { width:100%; border:0; border-radius:100px; background:var(--purple); color:#fff; padding:14px 18px; font:700 13px 'DM Sans',sans-serif; cursor:pointer; }
.submit:hover { background:#7839fa; }
.note { margin:0; color:#b7aacb; font-size:11px; line-height:1.7; }
.note a { color:#cbb5ff; text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
.motif { position:absolute; right:73px; top:20px; width:33px; height:33px; border:1px solid #bda3ff55; transform:rotate(-12deg); border-radius:5px; pointer-events:none; }
.motif::after { content:""; position:absolute; top:1px; left:16px; width:34px; height:34px; border:1px solid #bda3ff99; border-radius:50%; }
body.embedded { padding:0; min-height:0; display:block; background:transparent; }
body.embedded .card { width:100%; border:0; border-radius:0; box-shadow:none; }
@media(max-width:520px) { body { padding:10px; } .card { padding:23px; border-radius:17px; } .motif { display:none; } }
</style>
</head>
<body>
<main class="card" aria-labelledby="contactTitle">
  <div class="motif" aria-hidden="true"></div>
  <div class="header">
    <div><div class="eyebrow">QUERILY LABS / CONNECT</div><h1 id="contactTitle">Start a conversation.</h1></div>
    <button type="button" class="close" id="closeDialog" aria-label="Close contact dialog">×</button>
  </div>
  <p class="description">Pilots, ideas, research or partnerships. Tell us what you have in mind.</p>
  <form id="contactForm" novalidate>
    <div class="honeypot" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <label>I'm reaching out about
      <select name="topic" required>
        <option value="Request a demo">Request a demo</option>
        <option value="Explore an institutional pilot">Explore an institutional pilot</option>
        <option value="Research or strategic collaboration">Research or strategic collaboration</option>
        <option value="General inquiry">Something else</option>
      </select>
    </label>
    <label>Your name<input name="name" autocomplete="name" placeholder="Your name" maxlength="120" required></label>
    <label>Your email<input name="email" type="email" autocomplete="email" placeholder="you@organization.com" maxlength="254" required></label>
    <label>Your message<textarea name="message" placeholder="A little about your inquiry..." minlength="10" maxlength="4000" required></textarea></label>
    <div id="turnstileWidget" class="turnstile-box" aria-label="Spam prevention check"></div>
    <button type="submit" class="submit" id="sendButton">Send message ↗</button>
    <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
    <p class="note">Your message will be submitted securely to Querily Labs. Or email <a href="mailto:contact@querilylabs.com">contact@querilylabs.com</a>.</p>
  </form>
</main>
<script>
/* Public configuration only. NEVER put Resend, Turnstile secret, or Supabase service-role keys here. */
window.QUERILY_CONTACT_CONFIG = {
  endpoint: 'https://rfpzjaygjewojjqzqoop.supabase.co/functions/v1/contact-submit',
  turnstileSiteKey: '0x4AAAAAAFZKS1CFK-yqzQ4-'
};

(() => {
  'use strict';
  const config = window.QUERILY_CONTACT_CONFIG;
  const params = new URLSearchParams(window.location.search);
  const embedded = params.get('embed') === '1' && window.parent !== window;
  if (embedded) document.body.classList.add('embedded');
  const close = () => {
    if (embedded) window.parent.postMessage({type:'querily:close-connect'}, window.location.origin);
    else window.location.href = 'people.html#connect';
  };
  document.getElementById('closeDialog').addEventListener('click', close);

  const form = document.getElementById('contactForm');
  const button = document.getElementById('sendButton');
  const status = document.getElementById('formStatus');
  let turnstileToken = '';
  let widgetId = null;
  const setStatus = (message, state = '') => {
    status.textContent = message;
    status.dataset.state = state;
  };
  const configured = config.endpoint.startsWith('https://') &&
    config.turnstileSiteKey && !config.turnstileSiteKey.startsWith('REPLACE_');
  if (!configured) {
    button.disabled = true;
    setStatus('Contact form setup is in progress. Please email us directly.', 'error');
  }

  // Cloudflare's callback is invoked after its public widget script loads.
  window.onQuerilyTurnstileReady = () => {
    if (!configured || !window.turnstile) return;
    widgetId = window.turnstile.render('#turnstileWidget', {
      sitekey: config.turnstileSiteKey,
      callback: token => { turnstileToken = token; },
      'expired-callback': () => { turnstileToken = ''; },
      'error-callback': () => { turnstileToken = ''; setStatus('Security check unavailable. Please retry.', 'error'); }
    });
  };

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!form.reportValidity() || !configured) return;
    if (!turnstileToken) {
      setStatus('Please complete the security check before sending.', 'error');
      return;
    }
    const data = new FormData(form);
    const payload = {
      topic: String(data.get('topic') || ''),
      name: String(data.get('name') || '').trim(),
      email: String(data.get('email') || '').trim(),
      message: String(data.get('message') || '').trim(),
      website: String(data.get('website') || ''),
      turnstileToken
    };
    button.disabled = true;
    button.textContent = 'Sending…';
    setStatus('Submitting your message securely…');
    try {
      const result = await fetch(config.endpoint, {
        method: 'POST',
        mode: 'cors',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await result.json().catch(() => ({}));
      if (!result.ok || !json.ok) {
        throw new Error(json.error || 'Unable to submit right now. Please try again.');
      }
      form.reset();
      setStatus('Message submitted successfully. Thank you for reaching out.', 'success');
    } catch (error) {
      setStatus(error.message || 'Unable to submit right now. Please try again.', 'error');
    } finally {
      turnstileToken = '';
      if (window.turnstile && widgetId !== null) window.turnstile.reset(widgetId);
      button.disabled = !configured;
      button.textContent = 'Send message ↗';
    }
  });
})();
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onQuerilyTurnstileReady&amp;render=explicit" async defer></script>
</body>
</html>
